<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Для тебя ♥</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="hearts" aria-hidden="true" id="hearts"></div>

    <main class="scene">
      <section class="ask" id="ask-screen">
        <p class="ask__brand">для тебя</p>
        <h1 class="ask__title">
          Хочешь, покажу, как мы познакомились и что вместе пережили?
        </h1>
        <p class="ask__hint">Выбери сердцем — я уже знаю ответ.</p>

        <div class="ask__actions">
          <button type="button" class="btn btn--yes" id="yes-btn">
            Да, хочу
          </button>
          <span class="no-home" id="no-home">
            <button type="button" class="btn btn--no" id="no-btn">Нет</button>
          </span>
        </div>
      </section>

      <section class="book-screen" id="book-screen" hidden>
        <p class="book-screen__brand">для тебя</p>
        <p class="book-screen__hint" id="book-hint">
          Тяни страницу или кликай по краям, чтобы листать
        </p>

        <div class="book-stage">
          <button
            type="button"
            class="book-nav book-nav--prev"
            id="prev-btn"
            aria-label="Предыдущая страница"
          >
            ‹
          </button>

          <div class="book" id="book" aria-label="Книга с нашей историей">
            <div class="book__spine" aria-hidden="true"></div>
            <div class="book__pages" id="book-pages"></div>
          </div>

          <button
            type="button"
            class="book-nav book-nav--next"
            id="next-btn"
            aria-label="Следующая страница"
          >
            ›
          </button>
        </div>

        <p class="book-screen__counter" id="page-counter">1 / 1</p>

        <button type="button" class="btn btn--ghost" id="back-btn">
          Назад к вопросу
        </button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
